# AI 游戏平台 · 服务器部署栈（在 /srv/ai-game-platform 下执行）
#   TAG=sha-xxxx docker compose --env-file .env up -d --remove-orphans
name: ai-game-platform

x-log: &log
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  web:
    <<: *log
    image: "${WEB_IMAGE}:${TAG}"
    restart: unless-stopped
    ports: ["127.0.0.1:8081:80"]
    networks: [app]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    <<: *log
    image: "${API_IMAGE}:${TAG}"
    restart: unless-stopped
    env_file: [.env]
    environment:
      PLATFORM_DATABASE_URL: "postgresql+psycopg://${POSTGRES_PLATFORM_USER}:${POSTGRES_PLATFORM_PASSWORD}@postgres-platform:5432/${POSTGRES_PLATFORM_DB}?sslmode=disable"
      PG_ADMIN_HOST: postgres-games
      PG_ADMIN_PORT: "5432"
    volumes:
      - ./secrets/jwt:/app/.keys:ro
    ports: ["127.0.0.1:8082:8000"]
    networks: [app, data]
    mem_limit: 768m
    depends_on:
      postgres-platform: { condition: service_healthy }
      postgres-games:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  agent:
    <<: *log
    image: "${AGENT_IMAGE}:${TAG}"
    restart: unless-stopped
    env_file: [.env]
    environment:
      API_INTERNAL_URL: http://api:8000
      JWKS_URL: http://api:8000/.well-known/jwks.json
      POSTGRES_URI: "postgres://postgres:${LANGGRAPH_PG_PASSWORD}@langgraph-pg:5432/postgres?sslmode=disable"
      REDIS_URI: "redis://langgraph-redis:6379"
    ports: ["127.0.0.1:8083:8000"]
    networks: [app, data]
    mem_limit: 1536m
    depends_on:
      api: { condition: service_healthy }
      langgraph-pg: { condition: service_healthy }
      langgraph-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "/api/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  # 游戏库：AGS 沙盒经公网直连（数据库协议，不走 Caddy），强制 TLS
  postgres-games:
    <<: *log
    image: postgres:17.11
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=128MB
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/pgtls/server.crt
      - -c
      - ssl_key_file=/pgtls/server.key
    ports: ["10050:5432"]
    environment:
      POSTGRES_USER: "${POSTGRES_GAMES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_GAMES_PASSWORD}"
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      GAMES_ADMIN_USER: "${PG_ADMIN_USER}"
      GAMES_ADMIN_PASSWORD: "${PG_ADMIN_PASSWORD}"
    volumes:
      - pg-games-data:/var/lib/postgresql/data
      - ./secrets/pg-tls:/pgtls:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks: [data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_GAMES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-platform:
    <<: *log
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_PLATFORM_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PLATFORM_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_PLATFORM_DB}"
    volumes: ["pg-platform-data:/var/lib/postgresql/data"]
    networks: [data]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_PLATFORM_USER} -d ${POSTGRES_PLATFORM_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  langgraph-pg:
    <<: *log
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=100"]
    environment:
      POSTGRES_PASSWORD: "${LANGGRAPH_PG_PASSWORD}"
    volumes: ["langgraph-pg-data:/var/lib/postgresql/data"]
    networks: [data]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  langgraph-redis:
    <<: *log
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--save", ""]
    networks: [data]
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pg-games-data:
  pg-platform-data:
  langgraph-pg-data:

networks:
  app:
  data:
