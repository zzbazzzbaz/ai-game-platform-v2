[project]
name = "ai-game-api"
version = "0.1.0"
description = "AI 游戏平台后端（认证 / 沙盒编排 / 数据库开通 / 发布 / 预览）"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]==0.143.0",
    "sqlalchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.1",
    "bcrypt==5.0.0",
    "e2b==2.52.1",
    "cos-python-sdk-v5==1.9.44",
    "tencentcloud-sdk-python-tcb==3.1.183",
    "tencentcloud-sdk-python-tcbr==3.1.155",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.ruff]
target-version = "py314"
line-length = 100
preview = true
lint.select = ["E", "F", "I", "UP", "B", "ANN", "PYI", "PGH003"]
lint.ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/gateways/tcb.py" = ["ANN401"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::starlette.exceptions.StarletteDeprecationWarning"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "ty==0.0.84",
]
