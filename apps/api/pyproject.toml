[project]
name = "ai-game-api"
version = "0.1.0"
description = "AI 游戏平台后端（认证 / 沙盒编排 / 数据库开通 / 发布 / 预览）"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.6.1",
    "pyjwt[crypto]>=2.10.1",
    "bcrypt>=4.2.1",
    "e2b~=2.52.0",
    "cos-python-sdk-v5>=1.9.30",
    "tencentcloud-sdk-python-tcb>=3.0.1300",
    "tencentcloud-sdk-python-tcbr>=3.0.1300",
    "httpx>=0.28.1",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.ruff]
target-version = "py314"
line-length = 100
lint.select = ["E", "F", "I", "UP", "B"]
lint.ignore = ["E501"]

[dependency-groups]
dev = [
    "ruff>=0.8.4",
]
