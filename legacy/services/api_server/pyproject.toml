[project]
name = "game-api-server"
version = "0.1.0"
requires-python = ">=3.14,<3.15"

dependencies = [
    "fastapi[standard]==0.141.1",
    "modal==1.5.5",
    "boto3==1.43.93",
    "psycopg[binary]==3.3.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.ruff]
target-version = "py314"
line-length = 100
lint.select = ["E", "F", "I", "UP", "B"]
lint.ignore = ["E501"]

[dependency-groups]
dev = [
    "ruff==0.16.7",
]
