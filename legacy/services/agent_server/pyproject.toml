[project]
name = "game-agent-server"
version = "0.1.0"
requires-python = ">=3.14,<3.15"

dependencies = [
    "deepagents==0.7.13",
    "langchain==1.4.0",
    "langchain-deepseek==1.1.0",
    "langchain-openai==1.6.2",
    "modal==1.5.5",
    "langgraph==1.2.11",
    "langgraph-sdk==0.4.4",
    "langsmith==0.12.4",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["agent", "agent.*"]

[tool.ruff]
target-version = "py314"
line-length = 100
lint.select = ["E", "F", "I", "UP", "B"]
lint.ignore = ["E501"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]==0.4.31",
    "ruff==0.16.7",
]
