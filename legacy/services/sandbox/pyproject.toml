[project]
name = "game-sandbox-image"
version = "0.1.0"
description = "AI 游戏平台 · 沙箱镜像构建（工具链 + skills + 工程骨架）"
requires-python = ">=3.14,<3.15"

dependencies = [
    "modal==1.5.5",
]

[tool.ruff]
target-version = "py314"
line-length = 100
lint.select = ["E", "F", "I", "UP", "B"]
lint.ignore = ["E501"]

[dependency-groups]
dev = [
    "ruff==0.16.7",
]
