services:
  db:
    image: postgres:16
    container_name: crud-demo-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crud_demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # 命名卷（Docker 自管，无需共享宿主目录）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crud_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
