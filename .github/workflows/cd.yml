# CD：只能手动触发（gh workflow run cd.yml -f tag=main），push 不自动上生产
# tag 取 CI 推过的镜像：main = main 分支最新构建；sha-<commit> = 任意历史构建（回滚）
#   回滚示例：gh workflow run cd.yml -f tag=sha-<上一个 commit 的 40 位 sha>
# 镜像仓库：Docker Hub（docker.io），服务器每次部署用任务级凭据登录后拉取
name: cd

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要部署的镜像 tag（main 或 sha-<40 位 commit>）"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: cd
  cancel-in-progress: false

env:
  SITE_DOMAIN: ai-game-platform.test.chatgqt.top
  DEPLOY_HOST: 43.129.212.75
  DEPLOY_USER: guoqitong
  DEPLOY_ROOT: /srv/ai-game-platform

jobs:
  deploy:
    name: 部署（SSH 拉镜像重建容器）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 校验 tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^(main|sha-[0-9a-f]{40})$'; then
            echo "tag 只能是 main 或 sha-<40 位 commit>，收到：$TAG"
            exit 1
          fi

      - name: 安装部署私钥
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 同步部署文件（仅 compose / initdb）
        run: |
          # caddy/ 与 scripts/ 基本不变，不再每次同步；需要时手工更新（见 deploy/AGENTS.md）
          # 先清空再上传：scp 只覆盖不删除，仓库里删掉的文件会一直残留在服务器上
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "rm -rf '$DEPLOY_ROOT/initdb' '$DEPLOY_ROOT/docker-compose.yml'"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -r \
            deploy/docker-compose.yml deploy/initdb \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/"

      - name: 在服务器登录 Docker Hub（用任务级临时凭据，服务器不留长期令牌）
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "printf '%s' '$DOCKERHUB_TOKEN' | docker login docker.io -u '$DOCKERHUB_USER' --password-stdin"

      - name: 服务器上部署（拉镜像 → 重建容器）
        env:
          TAG: ${{ inputs.tag }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_ROOT='$DEPLOY_ROOT' TAG='$TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_ROOT"

          echo "==> 权限兜底：initdb 需容器内 postgres(999) 可读；compose 需 644"
          chmod 755 initdb/*.sh 2>/dev/null || true
          chmod 644 docker-compose.yml 2>/dev/null || true

          echo "==> 拉取镜像（TAG=$TAG）"
          docker compose --env-file .env pull

          echo "==> 重建容器"
          docker compose --env-file .env up -d --remove-orphans

          docker image prune -f
          docker compose --env-file .env ps
          REMOTE

      - name: 公网健康检查（HTTPS）
        run: |
          # 切域名/首次签发时证书要现签，必须带超时重试；端口被丢弃时 curl 会挂死
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -m 8 --connect-timeout 5 -w '%{http_code}' "https://$SITE_DOMAIN/health" || true)
            echo "第 $i 次探测：HTTP $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          curl -fsS -m 15 "https://$SITE_DOMAIN/health"
          echo

      - name: 校验证书与 HTTP 跳转
        run: |
          openssl s_client -connect "$SITE_DOMAIN:443" -servername "$SITE_DOMAIN" </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates
          # 必须是受信任证书（自签/过期会在这里失败）
          curl -fsS -o /dev/null -w '证书校验：ssl_verify_result=%{ssl_verify_result}（0 = 通过）\n' "https://$SITE_DOMAIN/health"
          curl -s -o /dev/null -m 15 -w 'HTTP 跳转：%{http_code} -> %{redirect_url}\n' "http://$SITE_DOMAIN/health"

      - name: 清理服务器 Docker Hub 登录态
        if: always()
        run: |
          # 镜像仓库是 public，部署完成后不在服务器保留 PAT
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker logout >/dev/null 2>&1 || true" || true
