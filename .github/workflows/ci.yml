# CI：push main 构建四个镜像——api/agent/web 推 GHCR，沙盒镜像推 Docker Hub
# （不在 CI 里跑测试；测试本地 `make test` / `npm run lint && npm run build`）
# 镜像 tag：sha-<commit>（回滚用）+ main（main 分支最新一次构建）；部署见 cd.yml（手动触发）
# 沙盒镜像：AGS 工具直接引用 Docker Hub 的 sha-<commit>，不再走 CCR/TCR
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: 构建镜像 ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: apps/api
          - app: agent
            context: apps/agent
          - app: web
            context: apps/frontent-test-1
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: deploy/docker/${{ matrix.app }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:main
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  sandbox:
    name: 构建沙盒镜像 sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: sandbox
          file: sandbox/image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ai-game-platform-sandbox:sha-${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ai-game-platform-sandbox:main
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,scope=sandbox,mode=max
