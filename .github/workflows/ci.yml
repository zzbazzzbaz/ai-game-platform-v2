# CI：push 自动跑「测试 → 构建三镜像推 GHCR」；部署是独立的手动流程（cd.yml）
# 镜像 tag：sha-<commit>（回滚用）+ main（main 分支最新一次构建）
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: 测试（api + 前端）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aigame_platform
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: 准备测试配置 apps/.env（源自 .env.example）
        run: |
          cp apps/.env.example apps/.env
          sed -i 's#^PLATFORM_DATABASE_URL=.*#PLATFORM_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5434/aigame_platform?sslmode=disable#' apps/.env

      - name: 生成 JWT 测试密钥
        working-directory: apps/api
        run: |
          mkdir -p .keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out .keys/jwt_private.pem
          openssl rsa -pubout -in .keys/jwt_private.pem -out .keys/jwt_public.pem

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: api 静态检查 + 用例
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontent-test-1/package-lock.json

      - name: 前端 lint + 构建
        working-directory: apps/frontent-test-1
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_LG_BASE_URL: /lg
          VITE_LG_ASSISTANT_ID: game
        run: |
          npm ci
          npm run lint
          npm run build

  build:
    name: 构建镜像 ${{ matrix.app }}
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: apps/api
          - app: agent
            context: apps/agent
          - app: web
            context: apps/frontent-test-1
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: deploy/docker/${{ matrix.app }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:main
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
