# AI 游戏平台 · 运维动作（手动触发；只提供固定动作，不接受任意命令）
#
# 用途：本机网络不通/不在身边时，借 GitHub Runner 的 SSH 通道查看服务器状态、日志与 COS 落物。
name: ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: 运维动作
        type: choice
        required: true
        default: status
        options:
          - status
          - logs-api
          - logs-agent
          - caddy-check
          - cos-ls
      arg:
        description: "参数（cos-ls 传 game_id；其它动作忽略）"
        type: string
        default: ""

permissions:
  contents: read

env:
  DEPLOY_HOST: 43.129.212.75
  DEPLOY_USER: guoqitong
  DEPLOY_ROOT: /srv/ai-game-platform

jobs:
  ops:
    name: ops / ${{ inputs.action }}
    runs-on: ubuntu-latest
    steps:
      - name: 安装部署私钥
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 执行动作
        env:
          ACTION: ${{ inputs.action }}
          ARG: ${{ inputs.arg }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "ACTION='$ACTION' ARG='$ARG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /srv/ai-game-platform
          case "$ACTION" in
            status)
              docker compose --env-file .env ps --format 'table {{.Name}}\t{{.Status}}'
              echo
              free -h | head -2
              echo
              echo "caddy: $(systemctl is-active caddy)"
              systemctl list-timers ai-game-backup.timer --no-pager | head -3
              ;;
            logs-api)
              docker compose --env-file .env logs --tail 60 api
              ;;
            logs-agent)
              docker compose --env-file .env logs --tail 60 agent
              ;;
            caddy-check)
              set -a; . ./caddy.env; set +a
              caddy validate --config caddy/Caddyfile 2>&1 | tail -2
              echo "--- 监听端口 ---"
              ss -lntp 2>/dev/null | grep -E ':80|:443' || true
              echo "--- caddy 最近日志（需 sudo，失败则跳过）---"
              sudo -n journalctl -u caddy --since '30 min ago' --no-pager 2>/dev/null | tail -8 || echo "(跳过)"
              ;;
            cos-ls)
              if [ -z "$ARG" ]; then echo "cos-ls 需要 arg=game_id"; exit 1; fi
              docker compose --env-file .env exec -T api python -c 'import os, sys
          from qcloud_cos import CosConfig, CosS3Client
          cfg = CosConfig(Region=os.environ["COS_REGION"], SecretId=os.environ["COS_SECRET_ID"], SecretKey=os.environ["COS_SECRET_KEY"])
          client = CosS3Client(cfg)
          prefix = os.environ.get("COS_GAMES_PREFIX", "games") + "/" + sys.argv[1] + "/"
          items = client.list_objects(Bucket=os.environ["COS_BUCKET"], Prefix=prefix, MaxKeys=200).get("Contents", [])
          print("prefix=" + prefix + " 对象数=" + str(len(items)))
          for i in items[:40]:
              print("  " + i["Key"] + "  " + str(int(i["Size"])) + "B  " + i["LastModified"])' "$ARG"
              ;;
            *)
              echo "未知动作: $ACTION"; exit 1 ;;
          esac
          REMOTE
